<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorkoutLog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: #ffffff;
        }

        header {
            padding: 24px;
            border-bottom: 1px solid #2a2d35;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #9ca3af;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 24px;
        }

        .status {
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .session {
            background: #191c22;
            border: 1px solid #2a2d35;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .session h2 {
            margin-top: 0;
        }

        .meta {
            color: #9ca3af;
            margin-bottom: 15px;
        }

        .exercise {
            background: #22262e;
            padding: 14px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .exercise strong {
            display: block;
            margin-bottom: 5px;
        }

        #filter {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: 1px solid #2a2d35;
    background: #191c22;
    color: white;
    font-size: 16px;
}
        
    </style>
</head>

<body>

<header>
    <h1>WorkoutLog</h1>
    <p>Historial de entrenamiento</p>
</header>

<main>

    <div id="status" class="status">
        Cargando entrenamientos...
    </div>
    
<select id="filter">
    <option value="Todos">Todos</option>
</select>
    
    <div id="sessions"></div>

</main>

<script>

async function cargarEntrenamientos() {

    const status = document.getElementById("status");
    const container = document.getElementById("sessions");

    try {

        const response = await fetch("/api/sessions");

        if (!response.ok) {
            throw new Error("Error del servidor");
        }

        const sessions = await response.json();

const filter = document.getElementById("filter");

// Crear automáticamente las opciones del filtro
const grupos = [...new Set(
    sessions
        .map(session => session.activity)
        .filter(Boolean)
)];

grupos.forEach(grupo => {
    const option = document.createElement("option");
    option.value = grupo;
    option.textContent = grupo;
    filter.appendChild(option);
});

function mostrarSesiones(filtroSeleccionado) {

    container.innerHTML = "";

    const sesionesFiltradas =
        filtroSeleccionado === "Todos"
            ? sessions
            : sessions.filter(
                session => session.activity === filtroSeleccionado
            );

    status.textContent =
        sesionesFiltradas.length +
        " entrenamiento(s) registrado(s)";

    sesionesFiltradas.forEach(session => {

        const card = document.createElement("div");
        card.className = "session";

        const fecha =
            new Date(session.startedAt).toLocaleString();

        let exercisesHTML = "";

        session.exercises.forEach(exercise => {

            exercisesHTML += `
                <div class="exercise">
                    <strong>${exercise.name}</strong>

                    ${exercise.sets} series ×
                    ${exercise.reps} repeticiones

                    · ${exercise.weightKg} kg
                </div>
            `;

        });

        card.innerHTML = `
            <h2>${session.activity}</h2>

            <div class="meta">
                ${fecha}
                · ${session.intensity}
            </div>

            ${exercisesHTML}
        `;

        container.appendChild(card);

    });
}

filter.addEventListener("change", () => {
    mostrarSesiones(filter.value);
});

mostrarSesiones("Todos");

    } catch(error) {

        status.textContent =
            "No se pudieron cargar los entrenamientos.";

        console.error(error);

    }

}

cargarEntrenamientos();

</script>

</body>
</html>

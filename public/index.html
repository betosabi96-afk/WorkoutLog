<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkoutLog</title>

    <style>

        :root {
            --navy-deep: #011142;
            --navy: #011C6B;
            --blue-dark: #01258F;
            --blue-bright: #023BE6;
            --blue: #0231BD;
            --white: #ffffff;
            --text-soft: #d7e0ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--navy-deep);
            color: var(--white);
        }

        header {
            padding: 24px;
            border-bottom: 1px solid var(--blue-dark);
            background: linear-gradient(135deg, var(--navy-deep), var(--navy));
        }

        header h1 { margin: 0; }
        header p { color: var(--text-soft); }

        main {
            max-width: 1050px;
            margin: auto;
            padding: 24px;
        }

        .status {
            color: var(--text-soft);
            margin-bottom: 20px;
        }

        .panel,
        .session {
            background: var(--navy);
            border: 1px solid var(--blue-dark);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel h2,
        .session h2 { margin-top: 0; }

        #filter,
        #exerciseFilter,
        #metricFilter {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--blue-dark);
            background: var(--blue-dark);
            color: var(--white);
            font-size: 16px;
        }

        #filter {
            margin-bottom: 20px;
            background: var(--navy);
        }

        .progress-controls {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        #progressResult {
            color: var(--text-soft);
            margin-bottom: 16px;
        }

        .progress-entry,
        .exercise {
            background: var(--blue-dark);
            padding: 14px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .progress-entry strong,
        .exercise strong {
            display: block;
            margin-bottom: 5px;
            color: var(--white);
        }


        .progress-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin: 16px 0;
        }

        .summary-card {
            background: var(--navy-deep);
            border: 1px solid var(--blue-dark);
            border-radius: 12px;
            padding: 14px;
        }

        .summary-label {
            display: block;
            color: var(--text-soft);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 22px;
            font-weight: bold;
        }

        .chart-wrap {
            background: var(--navy-deep);
            border: 1px solid var(--blue-dark);
            border-radius: 12px;
            padding: 12px;
            overflow-x: auto;
        }

        #progressChart {
            width: 100%;
            min-height: 260px;
        }

        #progressChart svg {
            width: 100%;
            height: 260px;
            display: block;
        }

        .chart-empty {
            color: var(--text-soft);
            padding: 24px 8px;
            text-align: center;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .calendar-header h2 {
            margin: 0;
            text-align: center;
            flex: 1;
        }

        .calendar-nav {
            border: 1px solid var(--blue-bright);
            background: var(--blue-bright);
            color: white;
            border-radius: 10px;
            min-width: 44px;
            min-height: 44px;
            font-size: 20px;
            cursor: pointer;
        }

        .calendar-weekdays,
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }

        .calendar-weekdays {
            margin-bottom: 8px;
            color: var(--text-soft);
            text-align: center;
            font-size: 13px;
        }

        .calendar-day {
            min-height: 88px;
            border: 1px solid var(--blue-dark);
            border-radius: 10px;
            background: var(--navy-deep);
            color: var(--white);
            padding: 8px;
            text-align: left;
            cursor: pointer;
        }

        .calendar-day.empty {
            opacity: 0.25;
            cursor: default;
        }

        .calendar-day.has-workout {
            background: var(--blue);
            border-color: var(--blue-bright);
        }

        .calendar-day.selected {
            outline: 2px solid var(--blue-bright);
        }

        .day-number { font-weight: bold; }

        .workout-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--blue-bright);
            margin-top: 8px;
        }

        .workout-count {
            display: block;
            color: var(--text-soft);
            font-size: 12px;
            margin-top: 6px;
        }

        #calendarDetails { margin-top: 18px; }

        .calendar-detail-title {
            margin: 0 0 12px;
        }

        .meta {
            color: var(--text-soft);
            margin-bottom: 15px;
        }

        @media (max-width: 700px) {
            main { padding: 16px; }

            .progress-controls {
                grid-template-columns: 1fr;
            }

            .progress-summary {
                grid-template-columns: 1fr;
            }

            .calendar-weekdays,
            .calendar-grid {
                gap: 4px;
            }

            .calendar-day {
                min-height: 70px;
                padding: 6px;
            }

            .workout-count { display: none; }
        }
    </style>
</head>

<body>

<header>
    <h1>WorkoutLog</h1>
    <p>Historial de entrenamiento</p>
</header>

<main>

    <div id="status" class="status">
        Cargando entrenamientos...
    </div>

    <select id="filter">
        <option value="Todos">Todos</option>
    </select>

    <section id="progress" class="panel">
        <h2>Progreso por ejercicio</h2>

        <div class="progress-controls">
            <select id="exerciseFilter">
                <option value="">Selecciona un ejercicio</option>
            </select>

            <select id="metricFilter">
                <option value="weightKg">Peso</option>
                <option value="reps">Repeticiones</option>
                <option value="sets">Series</option>
            </select>
        </div>

        <div id="progressResult"></div>

        <div id="progressSummary" class="progress-summary">
            <div class="summary-card">
                <span class="summary-label">Valor actual</span>
                <span id="summaryCurrent" class="summary-value">—</span>
            </div>

            <div class="summary-card">
                <span class="summary-label">Mejor marca</span>
                <span id="summaryBest" class="summary-value">—</span>
            </div>

            <div class="summary-card">
                <span class="summary-label">Cambio vs. anterior</span>
                <span id="summaryChange" class="summary-value">—</span>
            </div>
        </div>

        <div class="chart-wrap">
            <div id="progressChart">
                <div class="chart-empty">Selecciona un ejercicio para ver su gráfica.</div>
            </div>
        </div>
    </section>

    <section id="calendarSection" class="panel">
        <div class="calendar-header">
            <button id="prevMonth" class="calendar-nav" type="button" aria-label="Mes anterior">‹</button>
            <h2 id="calendarTitle">Calendario</h2>
            <button id="nextMonth" class="calendar-nav" type="button" aria-label="Mes siguiente">›</button>
        </div>

        <div class="calendar-weekdays" aria-hidden="true">
            <div>Dom</div>
            <div>Lun</div>
            <div>Mar</div>
            <div>Mié</div>
            <div>Jue</div>
            <div>Vie</div>
            <div>Sáb</div>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>
        <div id="calendarDetails"></div>
    </section>

    <div id="sessions"></div>

</main>

<script>
async function cargarEntrenamientos() {
    const AUTO_REFRESH_MS = 10000;
    const status = document.getElementById("status");
    const container = document.getElementById("sessions");
    const filter = document.getElementById("filter");
    const exerciseFilter = document.getElementById("exerciseFilter");
    const metricFilter = document.getElementById("metricFilter");
    const progressResult = document.getElementById("progressResult");
    const progressChart = document.getElementById("progressChart");
    const summaryCurrent = document.getElementById("summaryCurrent");
    const summaryBest = document.getElementById("summaryBest");
    const summaryChange = document.getElementById("summaryChange");
    const calendarGrid = document.getElementById("calendarGrid");
    const calendarTitle = document.getElementById("calendarTitle");
    const calendarDetails = document.getElementById("calendarDetails");
    const prevMonth = document.getElementById("prevMonth");
    const nextMonth = document.getElementById("nextMonth");

    try {
        const response = await fetch("/api/sessions");

        if (!response.ok) {
            throw new Error("Error del servidor");
        }

        const sessions = await response.json();

        const grupos = [...new Set(
            sessions.map(session => session.activity).filter(Boolean)
        )].sort((a, b) => a.localeCompare(b, "es"));

        grupos.forEach(grupo => {
            const option = document.createElement("option");
            option.value = grupo;
            option.textContent = grupo;
            filter.appendChild(option);
        });

        const filtroGuardado = sessionStorage.getItem("workout_filter");
        if (
            filtroGuardado &&
            [...filter.options].some(option => option.value === filtroGuardado)
        ) {
            filter.value = filtroGuardado;
        }

        const ejercicios = [...new Set(
            sessions.flatMap(session =>
                Array.isArray(session.exercises)
                    ? session.exercises.map(exercise => exercise.name).filter(Boolean)
                    : []
            )
        )].sort((a, b) => a.localeCompare(b, "es"));

        ejercicios.forEach(ejercicio => {
            const option = document.createElement("option");
            option.value = ejercicio;
            option.textContent = ejercicio;
            exerciseFilter.appendChild(option);
        });

        const ejercicioGuardado = sessionStorage.getItem("workout_exercise");
        if (
            ejercicioGuardado &&
            [...exerciseFilter.options].some(
                option => option.value === ejercicioGuardado
            )
        ) {
            exerciseFilter.value = ejercicioGuardado;
        }

        const metricaGuardada = sessionStorage.getItem("workout_metric");
        if (
            metricaGuardada &&
            [...metricFilter.options].some(
                option => option.value === metricaGuardada
            )
        ) {
            metricFilter.value = metricaGuardada;
        }

        function crearHistorialEjercicio(nombreEjercicio) {
            const historial = [];

            sessions.forEach(session => {
                (session.exercises || []).forEach(exercise => {
                    if (exercise.name === nombreEjercicio) {
                        historial.push({
                            fecha: new Date(session.startedAt),
                            sets: Number(exercise.sets) || 0,
                            reps: Number(exercise.reps) || 0,
                            weightKg: Number(exercise.weightKg) || 0
                        });
                    }
                });
            });

            historial.sort((a, b) => a.fecha - b.fecha);
            return historial;
        }

        function mostrarProgreso(nombreEjercicio) {
            if (!nombreEjercicio) {
                progressResult.innerHTML = "";
                summaryCurrent.textContent = "—";
                summaryBest.textContent = "—";
                summaryChange.textContent = "—";
                progressChart.innerHTML =
                    '<div class="chart-empty">Selecciona un ejercicio para ver su gráfica.</div>';
                return;
            }

            const historial = crearHistorialEjercicio(nombreEjercicio);

            progressResult.innerHTML = historial.map(registro => `
                <div class="progress-entry">
                    <strong>${registro.fecha.toLocaleDateString("es-MX")}</strong>
                    ${registro.sets} series ×
                    ${registro.reps} repeticiones
                    · ${registro.weightKg} kg
                </div>
            `).join("");

            actualizarResumen(historial, metricFilter.value);
            mostrarGrafica(historial, metricFilter.value);
        }

        function actualizarResumen(historial, metrica) {
            if (!historial.length) {
                summaryCurrent.textContent = "—";
                summaryBest.textContent = "—";
                summaryChange.textContent = "—";
                return;
            }

            const unidades = {
                weightKg: " kg",
                reps: " reps",
                sets: " series"
            };

            const valores = historial.map(item => Number(item[metrica]) || 0);
            const actual = valores[valores.length - 1];
            const mejor = Math.max(...valores);

            summaryCurrent.textContent = actual + unidades[metrica];
            summaryBest.textContent = mejor + unidades[metrica];

            if (valores.length < 2) {
                summaryChange.textContent = "—";
            } else {
                const anterior = valores[valores.length - 2];
                const cambio = actual - anterior;
                const signo = cambio > 0 ? "+" : "";
                summaryChange.textContent =
                    signo + cambio + unidades[metrica];
            }
        }

        function mostrarGrafica(historial, metrica) {
            if (!historial.length) {
                progressChart.innerHTML =
                    '<div class="chart-empty">No hay datos para este ejercicio.</div>';
                return;
            }

            const etiquetas = {
                weightKg: "kg",
                reps: "reps",
                sets: "series"
            };

            const valores = historial.map(item => Number(item[metrica]) || 0);
            const max = Math.max(...valores, 1);
            const min = Math.min(...valores, 0);

            const width = 800;
            const height = 260;
            const padLeft = 55;
            const padRight = 24;
            const padTop = 24;
            const padBottom = 48;
            const chartW = width - padLeft - padRight;
            const chartH = height - padTop - padBottom;

            const x = index => {
                if (historial.length === 1) return padLeft + chartW / 2;
                return padLeft + (index * chartW / (historial.length - 1));
            };

            const rango = Math.max(max - min, 1);
            const y = valor =>
                padTop + chartH - ((valor - min) / rango) * chartH;

            const puntos = historial
                .map((item, index) => `${x(index)},${y(Number(item[metrica]) || 0)}`)
                .join(" ");

            const marcas = historial.map((item, index) => {
                const valor = Number(item[metrica]) || 0;
                const fecha = item.fecha.toLocaleDateString("es-MX", {
                    day: "2-digit",
                    month: "2-digit"
                });

                return `
                    <circle cx="${x(index)}" cy="${y(valor)}" r="5" fill="white"></circle>
                    <text x="${x(index)}" y="${y(valor) - 10}" fill="#ffffff"
                          text-anchor="middle" font-size="12">${valor}</text>
                    <text x="${x(index)}" y="${height - 18}" fill="#d7e0ff"
                          text-anchor="middle" font-size="11">${fecha}</text>
                `;
            }).join("");

            progressChart.innerHTML = `
                <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Gráfica de progreso">
                    <line x1="${padLeft}" y1="${padTop}" x2="${padLeft}" y2="${height - padBottom}"
                          stroke="#0231BD" stroke-width="1"></line>
                    <line x1="${padLeft}" y1="${height - padBottom}" x2="${width - padRight}"
                          y2="${height - padBottom}" stroke="#0231BD" stroke-width="1"></line>
                    <text x="14" y="${padTop + 8}" fill="#d7e0ff" font-size="12">${max} ${etiquetas[metrica]}</text>
                    <text x="14" y="${height - padBottom}" fill="#d7e0ff" font-size="12">${min} ${etiquetas[metrica]}</text>
                    <polyline points="${puntos}" fill="none" stroke="#ffffff"
                              stroke-width="2.5" stroke-linejoin="round"
                              stroke-linecap="round"></polyline>
                    ${marcas}
                </svg>
            `;
        }

        function agruparSesionesPorFechaYActividad(listaSesiones) {
            const gruposVisuales = new Map();

            listaSesiones.forEach(session => {
                const fechaObj = new Date(session.startedAt);
                const y = fechaObj.getFullYear();
                const m = String(fechaObj.getMonth() + 1).padStart(2, "0");
                const d = String(fechaObj.getDate()).padStart(2, "0");
                const fechaKey = `${y}-${m}-${d}`;
                const actividad = session.activity || "Sin categoría";
                const key = `${fechaKey}__${actividad}`;

                if (!gruposVisuales.has(key)) {
                    gruposVisuales.set(key, {
                        fechaKey,
                        fechaObj,
                        activity: actividad,
                        intensity: session.intensity || "",
                        exercises: []
                    });
                }

                const grupo = gruposVisuales.get(key);

                if (!grupo.intensity && session.intensity) {
                    grupo.intensity = session.intensity;
                }

                (session.exercises || []).forEach(exercise => {
                    grupo.exercises.push(exercise);
                });
            });

            return [...gruposVisuales.values()].sort(
                (a, b) => b.fechaObj - a.fechaObj
            );
        }

        function mostrarSesiones(filtroSeleccionado) {
            container.innerHTML = "";

            const sesionesFiltradas =
                filtroSeleccionado === "Todos"
                    ? sessions
                    : sessions.filter(
                        session => session.activity === filtroSeleccionado
                    );

            const sesionesAgrupadas =
                agruparSesionesPorFechaYActividad(sesionesFiltradas);

            status.textContent =
                sesionesAgrupadas.length +
                " entrenamiento(s) registrado(s)";

            sesionesAgrupadas.forEach(session => {
                const card = document.createElement("div");
                card.className = "session";

                const fecha =
                    session.fechaObj.toLocaleDateString("es-MX");

                let exercisesHTML = "";

                (session.exercises || []).forEach(exercise => {
                    exercisesHTML += `
                        <div class="exercise">
                            <strong>${exercise.name}</strong>
                            ${exercise.sets} series ×
                            ${exercise.reps} repeticiones
                            · ${exercise.weightKg} kg
                        </div>
                    `;
                });

                card.innerHTML = `
                    <h2>${session.activity}</h2>
                    <div class="meta">
                        ${fecha}
                        ${session.intensity ? `· ${session.intensity}` : ""}
                    </div>
                    ${exercisesHTML}
                `;

                container.appendChild(card);
            });
        }

        function claveFecha(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, "0");
            const d = String(date.getDate()).padStart(2, "0");
            return `${y}-${m}-${d}`;
        }

        const sesionesPorDia = new Map();

        const sesionesAgrupadasCalendario =
            agruparSesionesPorFechaYActividad(sessions);

        sesionesAgrupadasCalendario.forEach(session => {
            const key = session.fechaKey;

            if (!sesionesPorDia.has(key)) {
                sesionesPorDia.set(key, []);
            }

            sesionesPorDia.get(key).push(session);
        });

        const fechaInicial = sessions.length
            ? new Date(sessions[0].startedAt)
            : new Date();

        let calendarioActual = new Date(
            fechaInicial.getFullYear(),
            fechaInicial.getMonth(),
            1
        );

        const mesGuardado = sessionStorage.getItem("workout_calendar_month");
        if (mesGuardado && /^\d{4}-\d{2}$/.test(mesGuardado)) {
            const [yearGuardado, monthGuardado] =
                mesGuardado.split("-").map(Number);

            calendarioActual = new Date(
                yearGuardado,
                monthGuardado - 1,
                1
            );
        }

        function guardarMesCalendario() {
            const y = calendarioActual.getFullYear();
            const m = String(calendarioActual.getMonth() + 1).padStart(2, "0");
            sessionStorage.setItem("workout_calendar_month", `${y}-${m}`);
        }

        function mostrarDetalleDia(key) {
            const delDia = sesionesPorDia.get(key) || [];

            if (!delDia.length) {
                calendarDetails.innerHTML =
                    '<div class="meta">No hay entrenamientos registrados en este día.</div>';
                return;
            }

            const fecha = new Date(key + "T12:00:00");

            calendarDetails.innerHTML = `
                <h3 class="calendar-detail-title">
                    ${fecha.toLocaleDateString("es-MX", {
                        day: "numeric",
                        month: "long",
                        year: "numeric"
                    })}
                </h3>
                ${delDia.map(session => `
                    <div class="session">
                        <h2>${session.activity}</h2>
                        <div class="meta">${session.intensity || ""}</div>

                        ${(session.exercises || []).map(exercise => `
                            <div class="exercise">
                                <strong>${exercise.name}</strong>
                                ${exercise.sets} series ×
                                ${exercise.reps} repeticiones
                                · ${exercise.weightKg} kg
                            </div>
                        `).join("")}
                    </div>
                `).join("")}
            `;
        }

        function renderCalendario() {
            calendarGrid.innerHTML = "";
            calendarDetails.innerHTML = "";

            const year = calendarioActual.getFullYear();
            const month = calendarioActual.getMonth();

            calendarTitle.textContent =
                calendarioActual.toLocaleDateString("es-MX", {
                    month: "long",
                    year: "numeric"
                }).replace(/^./, c => c.toUpperCase());

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement("div");
                empty.className = "calendar-day empty";
                calendarGrid.appendChild(empty);
            }

            for (let day = 1; day <= totalDays; day++) {
                const fecha = new Date(year, month, day);
                const key = claveFecha(fecha);
                const delDia = sesionesPorDia.get(key) || [];

                const button = document.createElement("button");
                button.type = "button";
                button.className = "calendar-day";

                if (delDia.length) {
                    button.classList.add("has-workout");
                }

                button.innerHTML = `
                    <span class="day-number">${day}</span>
                    ${delDia.length ? `
                        <span class="workout-dot"></span>
                        <span class="workout-count">
                            ${delDia.length} entrenamiento${delDia.length === 1 ? "" : "s"}
                        </span>
                    ` : ""}
                `;

                button.addEventListener("click", () => {
                    document
                        .querySelectorAll(".calendar-day.selected")
                        .forEach(el => el.classList.remove("selected"));

                    button.classList.add("selected");
                    mostrarDetalleDia(key);
                });

                calendarGrid.appendChild(button);
            }
        }

        filter.addEventListener("change", () => {
            sessionStorage.setItem("workout_filter", filter.value);
            mostrarSesiones(filter.value);
        });

        exerciseFilter.addEventListener("change", () => {
            sessionStorage.setItem("workout_exercise", exerciseFilter.value);
            mostrarProgreso(exerciseFilter.value);
        });

        metricFilter.addEventListener("change", () => {
            sessionStorage.setItem("workout_metric", metricFilter.value);

            if (exerciseFilter.value) {
                mostrarProgreso(exerciseFilter.value);
            }
        });

        prevMonth.addEventListener("click", () => {
            calendarioActual = new Date(
                calendarioActual.getFullYear(),
                calendarioActual.getMonth() - 1,
                1
            );
            guardarMesCalendario();
            renderCalendario();
        });

        nextMonth.addEventListener("click", () => {
            calendarioActual = new Date(
                calendarioActual.getFullYear(),
                calendarioActual.getMonth() + 1,
                1
            );
            guardarMesCalendario();
            renderCalendario();
        });

        mostrarSesiones(filter.value);

        if (exerciseFilter.value) {
            mostrarProgreso(exerciseFilter.value);
        }

        renderCalendario();

        const estadoInicial = JSON.stringify(sessions);

        setInterval(async () => {
            try {
                const refreshResponse = await fetch("/api/sessions", {
                    cache: "no-store"
                });

                if (!refreshResponse.ok) {
                    return;
                }

                const sesionesActualizadas =
                    await refreshResponse.json();

                const estadoActual =
                    JSON.stringify(sesionesActualizadas);

                if (estadoActual !== estadoInicial) {
                    sessionStorage.setItem("workout_filter", filter.value);
                    sessionStorage.setItem(
                        "workout_exercise",
                        exerciseFilter.value
                    );
                    sessionStorage.setItem(
                        "workout_metric",
                        metricFilter.value
                    );
                    guardarMesCalendario();

                    window.location.reload();
                }
            } catch (refreshError) {
                console.warn(
                    "No se pudo comprobar si hay nuevos entrenamientos.",
                    refreshError
                );
            }
        }, AUTO_REFRESH_MS);

    } catch(error) {
        status.textContent =
            "No se pudieron cargar los entrenamientos.";

        console.error(error);
    }
}

cargarEntrenamientos();
</script>

</body>
</html>
